<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel do bot</title>
    <style>
      :root {
        --fundo: #0f1115;
        --cartao: #171a21;
        --borda: #252a35;
        --texto: #e6e8eb;
        --apagado: #8b93a1;
        --verde: #3ddc84;
        --vermelho: #ff6b6b;
        --amarelo: #ffd166;
        --azul: #5aa9e6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: var(--fundo);
        color: var(--texto);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .container { max-width: 900px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--apagado); margin: 28px 0 10px; }
      .sub { color: var(--apagado); font-size: 13px; margin: 0 0 20px; }
      .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px; padding: 14px 16px; }
      .linha { display: flex; flex-wrap: wrap; gap: 10px; }
      .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
      .metrica .valor { font-size: 22px; font-weight: 600; }
      .metrica .rotulo { color: var(--apagado); font-size: 12px; }
      .etiqueta { display: inline-flex; align-items: center; gap: 6px; background: #1e222b; border: 1px solid var(--borda); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--apagado); }
      .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--apagado); }
      .ponto.on { background: var(--verde); }
      .ponto.off { background: var(--vermelho); }
      input, textarea, button {
        font: inherit; color: var(--texto); background: #11141a;
        border: 1px solid var(--borda); border-radius: 8px; padding: 9px 11px;
      }
      input, textarea { width: 100%; }
      textarea { resize: vertical; min-height: 64px; }
      button { cursor: pointer; background: #1e222b; }
      button:hover { border-color: #39414f; }
      button.primario { background: var(--verde); color: #06240f; border-color: transparent; font-weight: 600; }
      button:disabled { opacity: .5; cursor: progress; }
      .campo { margin-bottom: 10px; }
      .campo label { display: block; font-size: 12px; color: var(--apagado); margin-bottom: 4px; }
      .prontas button { font-size: 13px; }
      .evento { border-bottom: 1px solid var(--borda); padding: 10px 0; }
      .evento:last-child { border-bottom: 0; }
      .evento .topo { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--apagado); margin-bottom: 4px; }
      .evento .pergunta { color: var(--apagado); }
      .evento .resposta { white-space: pre-wrap; }
      .tipo { font-weight: 600; }
      .tipo.respondida { color: var(--verde); }
      .tipo.erro { color: var(--vermelho); }
      .tipo.ignorada { color: var(--amarelo); }
      .tipo.agendada { color: var(--azul); }
      .tarefa { border-bottom: 1px solid var(--borda); padding: 14px 0; }
      .tarefa:last-child { border-bottom: 0; }
      .tarefa .cabecalho { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .tarefa .cabecalho label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--apagado); }
      .tarefa .acoes { margin-left: auto; display: flex; gap: 6px; }
      .tarefa .acoes button { font-size: 12px; padding: 6px 9px; }
      .tarefa .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .tarefa .quando { color: var(--apagado); font-size: 12px; font-family: ui-monospace, monospace; }
      .tarefa input[type="checkbox"] { width: auto; }
      .rodapeAgenda { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
      .rodapeAgenda .aviso { font-size: 13px; }
      @media (max-width: 560px) { .tarefa .grade2 { grid-template-columns: 1fr; } }
      .tipo\.envio-manual, .tipo.envio-manual { color: var(--azul); }
      .vazio { color: var(--apagado); font-size: 13px; }
      #aviso { margin-top: 10px; font-size: 13px; min-height: 18px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Painel do bot</h1>
      <p class="sub">Atualiza a cada 3 segundos. Uso local.</p>

      <div class="linha" id="etiquetas"></div>

      <h2>Métricas</h2>
      <div class="grade" id="metricas"></div>

      <h2>Disparar mensagem</h2>
      <div class="cartao">
        <div class="campo">
          <label for="telefone">Telefone (DDI + DDD + número)</label>
          <input id="telefone" inputmode="numeric" placeholder="5519999999999" />
        </div>
        <div class="campo">
          <label for="texto">Mensagem</label>
          <textarea id="texto" placeholder="Escreva aqui..."></textarea>
        </div>
        <div class="linha prontas" id="prontas"></div>
        <div class="linha" style="margin-top: 10px">
          <button class="primario" id="enviar">Enviar</button>
        </div>
        <div id="aviso"></div>
      </div>

      <h2>Agenda</h2>
      <div class="cartao" id="tarefas"><p class="vazio">Carregando...</p></div>

      <h2>Mensagens e eventos</h2>
      <div class="cartao" id="eventos"><p class="vazio">Carregando...</p></div>
    </div>

    <script>
      const PRONTAS = [
        "Oi! Tudo bem?",
        "Teste do painel 🤖",
        "Manda uma foto que eu te digo o que é",
        "Qual a dose usual de creatina?",
      ];

      const $ = (id) => document.getElementById(id);
      const ms = (v) => (v == null ? "—" : v >= 1000 ? (v / 1000).toFixed(1) + "s" : v + "ms");
      const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR");
      const escapar = (s) =>
        String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      function pintarEtiquetas(e, online) {
        $("etiquetas").innerHTML = [
          `<span class="etiqueta"><span class="ponto ${online ? "on" : "off"}"></span>${online ? "bot no ar" : "bot fora do ar"}</span>`,
          `<span class="etiqueta">📱 ${escapar(e.whatsapp ?? "?")}</span>`,
          `<span class="etiqueta">🧠 ${escapar(e.ia ?? "?")}</span>`,
          `<span class="etiqueta">💬 prompt: ${escapar(e.prompt ?? "?")}</span>`,
        ].join("");
      }

      function pintarMetricas(r) {
        const itens = [
          ["Respondidas", r.respondidas ?? 0],
          ["Erros", r.erros ?? 0],
          ["Ignoradas", r.ignoradas ?? 0],
          ["Disparos manuais", r.enviadasManualmente ?? 0],
          ["IA média", ms(r.iaMedioMs)],
          ["IA p95", ms(r.iaP95Ms)],
          ["Total médio", ms(r.totalMedioMs)],
        ];
        $("metricas").innerHTML = itens
          .map(
            ([rotulo, valor]) =>
              `<div class="cartao metrica"><div class="valor">${escapar(valor)}</div><div class="rotulo">${rotulo}</div></div>`,
          )
          .join("");
      }

      // A agenda e editavel, entao o refresh automatico nao pode sobrescrever o
      // que esta sendo digitado: enquanto houver edicao pendente, a secao nao
      // e redesenhada.
      let agendaSuja = false;
      let vocabulario = { horas: [], dias: [], frequencias: [] };

      function opcoesDeHorario() {
        const combinacoes = [];
        for (const h of vocabulario.horas) {
          for (const d of vocabulario.dias) combinacoes.push(h + "+" + d);
        }
        return [...vocabulario.frequencias, ...combinacoes];
      }

      function linhaDeTarefa(t, i) {
        const v = (x) => escapar(x ?? "");
        return `<div class="tarefa" data-i="${i}">
            <div class="cabecalho">
              <label><input type="checkbox" data-campo="ativa" ${t.ativa ? "checked" : ""} /> ativa</label>
              <span class="quando">${v(t.quando)}</span>
              <span class="acoes">
                <button data-acao="executar">Executar agora</button>
                <button data-acao="remover">Remover</button>
              </span>
            </div>
            <div class="grade2">
              <input data-campo="nome" placeholder="nome-da-tarefa" value="${v(t.nome)}" />
              <input data-campo="cron" list="horariosDisponiveis" placeholder="9_AM+EVERY_DAY" value="${v(t.cron)}" />
              <input data-campo="telefone" inputmode="numeric" placeholder="5519999999999" value="${v(t.telefone)}" />
              <input data-campo="fonte" placeholder="URL da fonte (opcional)" value="${v(t.fonte)}" />
            </div>
            <textarea data-campo="instrucao" placeholder="O que pedir ao modelo..." style="margin-top:8px">${v(t.instrucao)}</textarea>
          </div>`;
      }

      function pintarTarefas(tarefas) {
        if (agendaSuja) return;
        const corpo = tarefas?.length
          ? tarefas.map(linhaDeTarefa).join("")
          : '<p class="vazio">Nenhuma tarefa ainda. Clique em "Nova tarefa".</p>';
        const opcoes = opcoesDeHorario().map((o) => `<option value="${o}">`).join("");

        $("tarefas").innerHTML = `${corpo}
          <datalist id="horariosDisponiveis">${opcoes}</datalist>
          <div class="rodapeAgenda">
            <button id="novaTarefa">Nova tarefa</button>
            <button class="primario" id="salvarAgenda">Salvar agenda</button>
            <span class="aviso" id="avisoAgenda"></span>
          </div>`;
      }

      function lerTarefasDaTela() {
        return [...document.querySelectorAll(".tarefa")].map((linha) => {
          const campo = (nome) => linha.querySelector(`[data-campo="${nome}"]`);
          return {
            nome: campo("nome").value.trim(),
            cron: campo("cron").value.trim(),
            ativa: campo("ativa").checked,
            telefone: campo("telefone").value.trim(),
            instrucao: campo("instrucao").value.trim(),
            fonte: campo("fonte").value.trim() || undefined,
          };
        });
      }

      function avisarAgenda(texto, cor) {
        const aviso = $("avisoAgenda");
        if (!aviso) return;
        aviso.textContent = texto;
        aviso.style.color = cor;
      }

      function marcarSuja() {
        agendaSuja = true;
        avisarAgenda("alterações não salvas", "var(--amarelo)");
      }

      // Redesenha com a lista que está na tela (mais ou menos uma linha),
      // preservando o que foi digitado e sem perder o estado de "suja".
      function redesenharComEdicoes(tarefas) {
        agendaSuja = false;
        pintarTarefas(tarefas.map((t) => ({ ...t, quando: t.quando ?? "não salva" })));
        marcarSuja();
      }

      async function salvarAgenda() {
        avisarAgenda("Salvando...", "var(--apagado)");
        try {
          const resposta = await fetch("/api/tarefas", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tarefas: lerTarefasDaTela() }),
          });
          const dados = await resposta.json();
          if (!resposta.ok) {
            throw new Error(dados.problemas?.length ? dados.problemas.join(" · ") : dados.erro ?? "falhou");
          }
          agendaSuja = false;
          pintarTarefas(dados.tarefas);
          avisarAgenda("✅ salva e reagendada", "var(--verde)");
        } catch (erro) {
          avisarAgenda("❌ " + erro.message, "var(--vermelho)");
        }
      }

      $("tarefas").addEventListener("input", marcarSuja);
      $("tarefas").addEventListener("change", marcarSuja);

      $("tarefas").addEventListener("click", async (ev) => {
        const botao = ev.target.closest("button");
        if (!botao) return;

        if (botao.id === "salvarAgenda") return salvarAgenda();

        if (botao.id === "novaTarefa") {
          redesenharComEdicoes([
            ...lerTarefasDaTela(),
            { nome: "", cron: "9_AM+EVERY_DAY", ativa: false, telefone: "", instrucao: "" },
          ]);
          return;
        }

        const linha = botao.closest(".tarefa");
        if (!linha) return;

        if (botao.dataset.acao === "remover") {
          const indice = Number(linha.dataset.i);
          redesenharComEdicoes(lerTarefasDaTela().filter((_, i) => i !== indice));
          return;
        }

        if (botao.dataset.acao === "executar") {
          const nome = linha.querySelector('[data-campo="nome"]').value.trim();
          const rotulo = botao.textContent;
          botao.disabled = true;
          botao.textContent = "Executando...";
          try {
            const resposta = await fetch(`/api/tarefas/${encodeURIComponent(nome)}/executar`, { method: "POST" });
            const dados = await resposta.json();
            if (!resposta.ok) throw new Error(dados.erro ?? "falhou");
            botao.textContent = "✅ Enviada";
            atualizar();
          } catch (erro) {
            botao.textContent = "❌ " + erro.message;
          } finally {
            setTimeout(() => {
              botao.disabled = false;
              botao.textContent = rotulo;
            }, 2500);
          }
        }
      });

      function pintarEventos(eventos) {
        if (!eventos?.length) {
          $("eventos").innerHTML = '<p class="vazio">Nada ainda. Manda uma mensagem para o bot.</p>';
          return;
        }
        $("eventos").innerHTML = eventos
          .map((e) => {
            const tempos = [e.iaMs && `IA ${ms(e.iaMs)}`, e.envioMs && `envio ${ms(e.envioMs)}`, e.totalMs && `total ${ms(e.totalMs)}`]
              .filter(Boolean)
              .join(" · ");
            const corpo =
              e.tipo === "erro"
                ? `<div class="resposta" style="color:var(--vermelho)">${escapar(e.erro)}</div>`
                : e.tipo === "ignorada"
                  ? `<div class="pergunta">${escapar(e.motivo)}</div>`
                  : `${e.pergunta ? `<div class="pergunta">↪ ${escapar(e.pergunta)}</div>` : ""}<div class="resposta">${escapar(e.resposta)}</div>`;
            return `<div class="evento">
                <div class="topo">
                  <span class="tipo ${e.tipo}">${e.tipo}</span>
                  <span>${escapar(e.telefone ?? "")}</span>
                  ${e.tarefa ? `<span>⏰ ${escapar(e.tarefa)}</span>` : ""}
                  ${e.midiaTipo === "imagem" ? "<span>🖼️</span>" : e.midiaTipo === "audio" ? "<span>🎤</span>" : ""}
                  <span style="margin-left:auto">${hora(e.em)}${tempos ? " · " + tempos : ""}</span>
                </div>
                ${corpo}
              </div>`;
          })
          .join("");
      }

      let primeiraCarga = true;

      async function atualizar() {
        try {
          const estado = await (await fetch("/api/estado")).json();
          pintarEtiquetas(estado, true);
          pintarMetricas(estado.resumo ?? {});
          pintarTarefas(estado.tarefas);
          pintarEventos(estado.eventos);
          if (primeiraCarga && estado.numeroTeste && !$("telefone").value) {
            $("telefone").value = estado.numeroTeste;
          }
          primeiraCarga = false;
        } catch {
          pintarEtiquetas({}, false);
        }
      }

      $("prontas").innerHTML = PRONTAS.map(
        (t, i) => `<button data-i="${i}">${escapar(t.length > 28 ? t.slice(0, 28) + "…" : t)}</button>`,
      ).join("");
      $("prontas").addEventListener("click", (ev) => {
        const i = ev.target.dataset?.i;
        if (i != null) $("texto").value = PRONTAS[i];
      });

      $("enviar").addEventListener("click", async () => {
        const botao = $("enviar");
        const aviso = $("aviso");
        botao.disabled = true;
        aviso.textContent = "Enviando...";
        aviso.style.color = "var(--apagado)";
        try {
          const resposta = await fetch("/api/enviar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ telefone: $("telefone").value, texto: $("texto").value }),
          });
          const dados = await resposta.json();
          if (!resposta.ok) throw new Error(dados.erro ?? "falhou");
          aviso.textContent = "✅ Enviada para " + dados.telefone;
          aviso.style.color = "var(--verde)";
          $("texto").value = "";
          atualizar();
        } catch (erro) {
          aviso.textContent = "❌ " + erro.message;
          aviso.style.color = "var(--vermelho)";
        } finally {
          botao.disabled = false;
        }
      });

      // O vocabulário de horários vem do servidor, para não duplicar as tabelas
      // aqui no navegador.
      fetch("/api/horarios")
        .then((r) => r.json())
        .then((v) => {
          vocabulario = v;
        })
        .catch(() => {})
        .finally(atualizar);

      setInterval(atualizar, 3000);
    </script>
  </body>
</html>
